name: CI

"on":
  push:
    branches:
      - main
      - integration
  pull_request:
  # Reutilizado por release.yml: el release solo corre si el gate pasa
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: tsc + biome + cargo test + vitest (debe pasar antes de integrar)
  gate:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Configurar pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 12.4.1

      - name: Configurar toolchain de Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # Cache de dependencias compiladas: la primera ejecución compila Rust desde cero (~15 min);
      # con cache las siguientes tardan una fracción.
      - name: Cache de compilación de Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri

      - name: Instalar dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev

      - name: Instalar dependencias de la app
        run: cd app && pnpm install --frozen-lockfile

      - name: Typecheck
        run: cd app && pnpm exec tsc --noEmit

      - name: Lint
        run: cd app && pnpm exec biome check .

      - name: Tests Rust
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      - name: Tests frontend
        run: cd app && pnpm exec vitest run

  # Tests de la extension GNOME: GJS puro sobre un bus D-Bus privado
  extension:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar GJS y D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs dbus libglib2.0-bin

      - name: Tests de la extension
        run: |
          for t in manifest clipboardService windowMatch callAppRetry windowPlacement shortcuts systemBindings shortcutRecorder shortcutsDbus serviceName panelIcon appProcess; do
            dbus-run-session -- gjs -m "extension/tests/$t.test.js"
          done

      - name: Test del empaquetado de la extension
        run: |
          sudo apt-get install -y zip
          bash extension/package.test.sh

  # install.sh contra un release y directorios falsos, nunca la red real
  install:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # gjs: la migración valida los atajos heredados con lib/shortcuts.js de la extensión
      - name: Instalar desktop-file-utils y gjs
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils gjs

      - name: Test de install.sh
        run: bash install.test.sh
