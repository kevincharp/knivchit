[package]
name = "knivchit"
version = "0.1.0-alpha.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "knivchit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
ashpd = { version = "0.13.13", features = ["screenshot", "notification", "file_chooser", "raw_handle", "wayland"] }
zbus = "5.19.0"
raw-window-handle = "0.6"
uuid = { version = "1.26.1", features = ["v4"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
futures-util = "0.3.34"
ureq = { version = "3.4.1", features = ["json"] }
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
gtk = "0.18"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
