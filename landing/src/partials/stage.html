<div class="stage" id="stage" data-step="1">
  <div class="stage-screen" role="img" aria-label="{{how.stage.alt2|attr}}" data-alts="{{how.stage.alt1|attr}}||{{how.stage.alt2|attr}}||{{how.stage.alt3|attr}}">
    <div class="desk" aria-hidden="true">
      <span class="dw dw-code"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span class="dw dw-term"><i></i><i></i><i></i></span>
      <span class="dw dw-web"><b></b><i></i><i></i><i></i></span>
    </div>
    <div class="dim" aria-hidden="true"></div>

    <div class="sel sel-a" aria-hidden="true"><span class="rd">412 × 236</span></div>

    <div class="sel sel-b" aria-hidden="true">
      <span class="rd">660 × 330</span>
      <div class="sel-clip">{{> shot}}</div>
      <i class="hd nw"></i><i class="hd n"></i><i class="hd ne"></i><i class="hd e"></i>
      <i class="hd se"></i><i class="hd s"></i><i class="hd sw"></i><i class="hd w"></i>
    </div>

    <div class="hint" aria-hidden="true"><span>{{how.stage.hint}}</span></div>
    <div class="bar-wrap" aria-hidden="true">{{> toolbar}}</div>

    <div class="pin" aria-hidden="true">{{> shot}}</div>
    <div class="toast" aria-hidden="true"><svg class="g"><use href="#i-check"/></svg>{{how.stage.toast}}</div>
    <span class="mock-tag">{{ui.diagramLabel}}</span>
  </div>
</div>
